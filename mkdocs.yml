site_name: Data Analytics
site_description: Practical Data Analytics for Working Professionals

docs_dir: docs
site_dir: site
nav:
  - Getting Started: index.md
  - Foundations:
      - Why Data Analytics Matters: foundations/index.md
      - Statistics Are Not Enough: foundations/statistics-are-not-enough.md
      - How Statistics Can Mislead: foundations/misleading-statistics.md
      - Types of Analysis: foundations/types-of-analysis.md
      - Designing Clear Visuals: foundations/visual-design.md
      - Storytelling with Data: foundations/storytelling.md
  - Course:
      - Learning Roadmap: course/roadmap.md
      - Setup and Practice: course/setup.md
      - Analytical Workflow: course/workflow.md
  - Business Cases: cases/index.md
  - Python Lessons:
      - "Lesson 0: Python and Colab Basics": lectures/00_python_and_colab_basics.md
      - "Lesson 1: From Decision to Evidence": lectures/01_decision_to_evidence.md
      - "Lesson 2: Can We Trust the Sales Table?": lectures/02_trust_the_sales_table.md
      - "Lesson 3: Which Segment Deserves a Closer Look?": lectures/03_segment_comparison.md
      - "Lesson 4: Trends, Returns and a Decision Dashboard": lectures/04_trends_returns_dashboard.md
  - Tableau (Coming Later):
      - "Tableau Lesson 1 (draft)": lessons/class-01.md
      - "Tableau Lesson 2 (draft)": lessons/class-02.md
      - "Tableau Lesson 3 (draft)": lessons/class-03.md
      - "Tableau Lesson 4 (draft)": lessons/class-04.md
  - Lesson Template: lessons/lesson-template.md

theme:
  name: readthedocs
  collapse_navigation: false
  navigation_depth: 3

extra_css:
  - stylesheets/readability.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist

extra:
  generator: false

